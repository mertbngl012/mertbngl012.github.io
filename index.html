<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Özel 💜</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* Derin bordo taban ve lüks çiçek işlemeli/dantelli zarif bir doku efekti */
            background-color: #3b0917;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(128, 0, 32, 0.6) 0%, rgba(20, 2, 7, 0.9) 100%),
                radial-gradient(rgba(180, 40, 80, 0.25) 2px, transparent 2px),
                radial-gradient(rgba(140, 20, 50, 0.2) 2px, transparent 2px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            background-position: 0 0, 0 0, 15px 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
            text-align: center;
        }

        .container {
            background: rgba(45, 5, 15, 0.55);
            border: 1px solid rgba(255, 105, 180, 0.2);
            padding: 40px 30px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 20, 147, 0.1);
            max-width: 380px;
            width: 85%;
            animation: fadeIn 1s ease-in-out;
            position: relative;
            z-index: 2;
        }

        .heart {
            font-size: 75px;
            /* Mor Kalp Rengi Efekti */
            filter: drop-shadow(0 0 12px rgba(186, 85, 211, 0.7));
            animation: heartbeat 1.2s infinite;
            cursor: pointer;
            margin-bottom: 15px;
            user-select: none;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.25); }
            60% { transform: scale(1); }
        }

        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            font-weight: 600;
            color: #f8bbd0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
            opacity: 0.95;
            min-height: 50px;
            color: #fce4ec;
        }

        .btn {
            background-color: #fff;
            color: #7b1fa2;
            border: none;
            padding: 13px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn:hover {
            background-color: #ba68c8;
            color: #fff;
            transform: translateY(-2px);
        }

        .btn-gift {
            background: linear-gradient(45deg, #ffd700, #ffae00);
            color: #5c2c00;
            animation: pulseBtn 1.5s infinite;
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 215, 0, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
        }

        /* Çiçek Sahnesi */
        .flower-scene {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 1s ease forwards;
        }

        .flower-wrapper {
            position: relative;
            width: 220px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Sap ve Yapraklar */
        .stem {
            position: absolute;
            bottom: 10px;
            width: 8px;
            height: 0;
            background: linear-gradient(to top, #1b4332, #40916c);
            border-radius: 4px;
            animation: growStem 1.2s ease-out forwards;
        }

        .leaf {
            position: absolute;
            width: 45px;
            height: 25px;
            background: #2d6a4f;
            border-radius: 0 50% 0 50%;
            opacity: 0;
        }

        .leaf.left {
            bottom: 75px;
            left: 65px;
            transform: rotate(-25deg) scale(0);
            animation: growLeafLeft 0.8s ease-out 0.8s forwards;
        }

        .leaf.right {
            bottom: 50px;
            right: 65px;
            border-radius: 50% 0 50% 0;
            transform: rotate(25deg) scale(0);
            animation: growLeafRight 0.8s ease-out 1s forwards;
        }

        /* Çiçek Başlığı ve Taç Yapraklar (Mor/Lila Tonlarında) */
        .bloom {
            position: absolute;
            top: 35px;
            width: 140px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .petal {
            position: absolute;
            width: 48px;
            height: 75px;
            background: radial-gradient(circle at 50% 20%, #e1bee7, #ab47bc 70%, #6a1b9a);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            transform-origin: bottom center;
            bottom: 50%;
            opacity: 0;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.4);
        }

        .p1 { transform: rotate(0deg) scale(0); animation: openPetal1 1s ease-out 1.1s forwards; }
        .p2 { transform: rotate(60deg) scale(0); animation: openPetal2 1s ease-out 1.25s forwards; }
        .p3 { transform: rotate(120deg) scale(0); animation: openPetal3 1s ease-out 1.4s forwards; }
        .p4 { transform: rotate(180deg) scale(0); animation: openPetal4 1s ease-out 1.55s forwards; }
        .p5 { transform: rotate(240deg) scale(0); animation: openPetal5 1s ease-out 1.7s forwards; }
        .p6 { transform: rotate(300deg) scale(0); animation: openPetal6 1s ease-out 1.85s forwards; }

        .center-dot {
            position: absolute;
            width: 34px;
            height: 34px;
            background: radial-gradient(circle, #fff3b0, #ffb703);
            border-radius: 50%;
            z-index: 5;
            transform: scale(0);
            box-shadow: 0 0 15px rgba(255, 183, 3, 0.8);
            animation: popCenter 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) 2s forwards;
        }

        .gift-note {
            margin-top: 10px;
            font-size: 20px;
            font-weight: bold;
            color: #f3e5f5;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            opacity: 0;
            animation: fadeIn 1s ease 2.3s forwards;
        }

        @keyframes growStem { to { height: 155px; } }
        @keyframes growLeafLeft { to { opacity: 1; transform: rotate(-25deg) scale(1); } }
        @keyframes growLeafRight { to { opacity: 1; transform: rotate(25deg) scale(1); } }
        
        @keyframes openPetal1 { to { opacity: 1; transform: rotate(0deg) scale(1); } }
        @keyframes openPetal2 { to { opacity: 1; transform: rotate(60deg) scale(1); } }
        @keyframes openPetal3 { to { opacity: 1; transform: rotate(120deg) scale(1); } }
        @keyframes openPetal4 { to { opacity: 1; transform: rotate(180deg) scale(1); } }
        @keyframes openPetal5 { to { opacity: 1; transform: rotate(240deg) scale(1); } }
        @keyframes openPetal6 { to { opacity: 1; transform: rotate(300deg) scale(1); } }
        @keyframes popCenter { to { transform: scale(1); } }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Mesaj Ekranı -->
        <div id="card-content">
            <div class="heart" onclick="nextStep()">💜</div>
            <h1 id="title">İyi ki Varsın</h1>
            <p id="message">Üstüne tıklayarak sürprizi görebilirsin...</p>
            <button class="btn" id="action-btn" onclick="nextStep()">Tıkla ve Gör</button>
        </div>

        <!-- Çiçek Animasyonu Ekranı -->
        <div class="flower-scene" id="flower-scene">
            <div class="flower-wrapper">
                <div class="stem"></div>
                <div class="leaf left"></div>
                <div class="leaf right"></div>
                <div class="bloom">
                    <div class="petal p1"></div>
                    <div class="petal p2"></div>
                    <div class="petal p3"></div>
                    <div class="petal p4"></div>
                    <div class="petal p5"></div>
                    <div class="petal p6"></div>
                    <div class="center-dot"></div>
                </div>
            </div>
            <div class="gift-note">Bu çiçek senin için güzelim 🌸💜</div>
        </div>
    </div>

    <script>
        const messages = [
            { title: "Seninle Her An...", text: "Dünyanın en güzel ve en değerli insanısın. İyi ki hayatımdasın! 🥰" },
            { title: "Birlikte Çok Güzeliz", text: "Gülüşün her şeye bedel. Seni çok ama çok seviyorum! ✨" },
            { title: "Sonsuza Kadar...", text: "Seninle geçirdiğim her saniye paha biçilemez. 💜" }
        ];

        let index = -1;
        let isLastStep = false;

        function nextStep() {
            if (isLastStep) {
                document.getElementById("card-content").style.display = "none";
                document.getElementById("flower-scene").style.display = "flex";
                return;
            }

            index++;
            document.getElementById("title").innerText = messages[index].title;
            document.getElementById("message").innerText = messages[index].text;

            if (index === messages.length - 1) {
                isLastStep = true;
                const btn = document.getElementById("action-btn");
                btn.innerText = "Hediyeni Al 🎁";
                btn.classList.add("btn-gift");
            }
        }
    </script>

</body>
</html>
