<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öküzünü Affeder Misin? 🐂</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        .bg-emoji {
            position: absolute;
            font-size: 2.5rem;
            opacity: 0.15;
            user-select: none;
            animation: float 6s infinite ease-in-out alternate;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-20px) rotate(15deg); }
        }

        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid #38bdf8;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 480px;
            width: 100%;
            z-index: 10;
            position: relative;
        }

        .ox-hero {
            font-size: 5rem;
            margin-bottom: 10px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1) rotate(-5deg); }
        }

        h1 {
            color: #f8fafc;
            font-size: 1.8rem;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-yes {
            background-color: #22c55e;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
        }

        .btn-yes:hover {
            background-color: #16a34a;
            transform: scale(1.05);
        }

        .btn-no {
            background-color: #ef4444;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
        }

        .btn-no:hover {
            background-color: #dc2626;
            transform: scale(1.05);
        }

        #message {
            margin-top: 25px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #facc15;
            min-height: 30px;
        }
    </style>
</head>
<body>

    <div class="bg-emoji" style="top: 10%; left: 10%;">🐂</div>
    <div class="bg-emoji" style="top: 20%; right: 15%; animation-delay: 1s;">🐂</div>
    <div class="bg-emoji" style="bottom: 15%; left: 15%; animation-delay: 2s;">🐂</div>
    <div class="bg-emoji" style="bottom: 10%; right: 10%; animation-delay: 1.5s;">🐂</div>

    <div class="card">
        <div class="ox-hero">🐂</div>
        <h1>Öküzünü affeder misin? ❤️</h1>

        <div class="btn-group">
            <button class="btn btn-yes" onclick="affet()">Evet, affettim ❤️</button>
            <button class="btn btn-no" onclick="surpriz()">Hayır 😤</button>
        </div>

        <div id="message"></div>
    </div>

    <script>
        function affet() {
            document.getElementById('message').innerText = "Kraliçesin! 🐂❤️ Öküzün seni çok seviyor!";
        }

        function surpriz() {
            const mesajlar = [
                "Ama gerçekten çok pişman! 🥺",
                "Bir şans daha versen? 🌾",
                "Bak yine möööö diye bakıyor... 🐂",
                "Affet gitsin büyüklük sende kalsın! ✨"
            ];
            const rastgele = mesajlar[Math.floor(Math.random() * mesajlar.length)];
            document.getElementById('message').innerText = rastgele;
        }
    </script>

</body>
</html>
