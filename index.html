<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Özel 💜</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #3b0917;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(128, 0, 32, 0.6) 0%, rgba(20, 2, 7, 0.9) 100%),
                radial-gradient(rgba(180, 40, 80, 0.25) 2px, transparent 2px),
                radial-gradient(rgba(140, 20, 50, 0.2) 2px, transparent 2px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            background-position: 0 0, 0 0, 15px 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
            text-align: center;
        }

        .container {
            background: rgba(45, 5, 15, 0.65);
            border: 1px solid rgba(255, 105, 180, 0.3);
            padding: 40px 30px;
            border-radius: 24px;
            backdrop-filter: blur(14px);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 20, 147, 0.15);
            max-width: 400px;
            width: 85%;
            animation: fadeIn 1s ease-in-out;
            position: relative;
            z-index: 2;
        }

        .heart {
            font-size: 75px;
            filter: drop-shadow(0 0 15px rgba(186, 85, 211, 0.8));
            animation: heartbeat 1.2s infinite;
            cursor: pointer;
            margin-bottom: 15px;
            user-select: none;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.25); }
            60% { transform: scale(1); }
        }

        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            font-weight: 600;
            color: #f8bbd0;
            text-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
            opacity: 0.95;
            min-height: 50px;
            color: #fce4ec;
        }

        .btn {
            background-color: #fff;
            color: #7b1fa2;
            border: none;
            padding: 13px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn:hover {
            background-color: #ba68c8;
            color: #fff;
            transform: translateY(-2px);
        }

        .btn-gift {
            background: linear-gradient(45deg, #ffd700, #ffae00);
            color: #5c2c00;
            animation: pulseBtn 1.5s infinite;
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 215, 0, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
        }

        /* Gelişmiş Çiçek Sahnesi */
        .flower-scene {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 1s ease forwards;
        }

        .flower-wrapper {
            position: relative;
            width: 240px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Zarif Kıvrımlı Sap */
        .stem {
            position: absolute;
            bottom: 5px;
            width: 6px;
            height: 0;
            background: linear-gradient(to top, #1b4332, #52b788);
            border-radius: 3px;
            animation: growStem 1s ease-out forwards;
        }

        /* Gerçekçi Yapraklar */
        .leaf {
            position: absolute;
            width: 50px;
            height: 28px;
            background: linear-gradient(135deg, #40916c, #2d6a4f);
            border-radius: 0 50% 0 50%;
            opacity: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .leaf.left {
            bottom: 80px;
            left: 60px;
            transform: rotate(-30deg) scale(0);
            animation: growLeafLeft 0.8s ease-out 0.7s forwards;
        }

        .leaf.right {
            bottom: 50px;
            right: 60px;
            border-radius: 50% 0 50% 0;
            transform: rotate(30deg) scale(0);
            animation: growLeafRight 0.8s ease-out 0.9s forwards;
        }

        /* Çok Katmanlı Lüks Çiçek Başı */
        .bloom {
            position: absolute;
            top: 25px;
            width: 160px;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .petal-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .petal {
            position: absolute;
            width: 42px;
            height: 80px;
            background: radial-gradient(circle at 50% 15%, #f3e5f5, #ab47bc 65%, #4a148c);
            border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
            transform-origin: bottom center;
            bottom: 50%;
            opacity: 0;
            box-shadow: inset 0 0 12px rgba(255,255,255,0.5), 0 0 8px rgba(171, 71, 188, 0.4);
        }

        /* Dış Katman Yaprakları (Açılış sırası) */
        .outer .p1 { transform: rotate(0deg) scale(0); animation: bloomPetal 0.8s ease-out 1s forwards; }
        .outer .p2 { transform: rotate(45deg) scale(0); animation: bloomPetal 0.8s ease-out 1.1s forwards; }
        .outer .p3 { transform: rotate(90deg) scale(0); animation: bloomPetal 0.8s ease-out 1.2s forwards; }
        .outer .p4 { transform: rotate(135deg) scale(0); animation: bloomPetal 0.8s ease-out 1.3s forwards; }
        .outer .p5 { transform: rotate(180deg) scale(0); animation: bloomPetal 0.8s ease-out 1.4s forwards; }
        .outer .p6 { transform: rotate(225deg) scale(0); animation: bloomPetal 0.8s ease-out 1.5s forwards; }
        .outer .p7 { transform: rotate(270deg) scale(0); animation: bloomPetal 0.8s ease-out 1.6s forwards; }
        .outer .p8 { transform: rotate(315deg) scale(0); animation: bloomPetal 0.8s ease-out 1.7s forwards; }

        /* İç Katman Yaprakları (Daha koyu/parlak ton) */
        .inner .petal {
            width: 35px;
            height: 65px;
            background: radial-gradient(circle at 50% 15%, #ffffff, #e040fb 60%, #7b1fa2);
        }
        .inner .pi1 { transform: rotate(22.5deg) scale(0); animation: bloomInnerPetal 0.7s ease-out 1.8s forwards; }
        .inner .pi2 { transform: rotate(67.5deg) scale(0); animation: bloomInnerPetal 0.7s ease-out 1.9s forwards; }
        .inner .pi3 { transform: rotate(112.5deg) scale(0); animation: bloomInnerPetal 0.7s ease-out 2.0s forwards; }
        .inner .pi4 { transform: rotate(157.5deg) scale(0); animation: bloomInnerPetal 0.7s ease-out 2.1s forwards; }
        .inner .pi5 { transform: rotate(202.5deg) scale(0); animation: bloomInnerPetal 0.7s ease-out 2.2s forwards; }
        .inner .pi6 { transform: rotate(247.5deg) scale(0); animation: bloomInnerPetal 0.7s ease-out 2.3s forwards; }
        .inner .pi7 { transform: rotate(292.5deg) scale(0); animation: bloomInnerPetal 0.7s ease-out 2.4s forwards; }
        .inner .pi8 { transform: rotate(337.5deg) scale(0); animation: bloomInnerPetal 0.7s ease-out 2.5s forwards; }

        /* Parlayan Çiçek Merkezi */
        .center-core {
            position: absolute;
            width: 44px;
            height: 44px;
            background: radial-gradient(circle, #fff 20%, #ffb703 70%, #ff8f00 100%);
            border-radius: 50%;
            z-index: 10;
            transform: scale(0);
            box-shadow: 0 0 20px rgba(255, 183, 3, 0.9), inset 0 0 8px rgba(255,255,255,0.8);
            animation: popCenter 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 2.6s forwards;
        }

        /* Parıltı Efektleri */
        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffeb3b;
            opacity: 0;
            animation: sparkleAnim 1.5s ease-in-out infinite;
        }
        .s1 { top: 20px; left: 40px; animation-delay: 2.7s; }
        .s2 { top: 40px; right: 30px; animation-delay: 3s; }
        .s3 { bottom: 60px; left: 50px; animation-delay: 2.9s; }

        .gift-note {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #f3e5f5;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
            opacity: 0;
            animation: fadeIn 1s ease 2.8s forwards;
        }

        @keyframes growStem { to { height: 165px; } }
        @keyframes growLeafLeft { to { opacity: 1; transform: rotate(-30deg) scale(1); } }
        @keyframes growLeafRight { to { opacity: 1; transform: rotate
