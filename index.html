<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Özel 💜</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #3b0917;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(128, 0, 32, 0.6) 0%, rgba(20, 2, 7, 0.9) 100%),
                radial-gradient(rgba(180, 40, 80, 0.25) 2px, transparent 2px),
                radial-gradient(rgba(140, 20, 50, 0.2) 2px, transparent 2px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            background-position: 0 0, 0 0, 15px 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
            text-align: center;
        }

        .container {
            background: rgba(45, 5, 15, 0.65);
            border: 1px solid rgba(255, 105, 180, 0.3);
            padding: 40px 30px;
            border-radius: 24px;
            backdrop-filter: blur(14px);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 20, 147, 0.15);
            max-width: 400px;
            width: 85%;
            animation: fadeIn 1s ease-in-out;
            position: relative;
            z-index: 2;
        }

        .heart {
            font-size: 75px;
            filter: drop-shadow(0 0 15px rgba(186, 85, 211, 0.8));
            animation: heartbeat 1.2s infinite;
            cursor: pointer;
            margin-bottom: 15px;
            user-select: none;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.25); }
            60% { transform: scale(1); }
        }

        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            font-weight: 600;
            color: #f8bbd0;
            text-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
            opacity: 0.95;
            min-height: 50px;
            color: #fce4ec;
        }

        .btn {
            background-color: #fff;
            color: #7b1fa2;
            border: none;
            padding: 13px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn:hover {
            background-color: #ba68c8;
            color: #fff;
            transform: translateY(-2px);
        }

        .btn-gift {
            background: linear-gradient(45deg, #ffd700, #ffae00);
            color: #5c2c00;
            animation: pulseBtn 1.5s infinite;
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 215, 0, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
        }

        /* Gelişmiş Çiçek Sahnesi */
        .flower-scene {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 1s ease forwards;
        }

        .flower-wrapper {
            position: relative;
            width: 240px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stem {
            position: absolute;
            bottom: 5px;
            width: 6px;
            height: 0;
            background: linear-gradient(to top, #1b4332, #52b788);
            border-radius: 3px;
            animation: growStem 1s ease-out forwards;
        }

        .leaf {
            position: absolute;
            width: 50px;
            height: 28px;
            background: linear-gradient(135deg, #40916c, #2d6a4f);
            border-radius: 0 50% 0 50%;
            opacity: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .leaf.left {
            bottom: 80px;
            left: 60px;
            transform: rotate(-30deg) scale(0);
            animation: growLeafLeft 0.8s ease-out 0.7s forwards;
        }

        .leaf.right {
            bottom: 50px;
            right: 60px;
            border-radius: 50% 0 50% 0;
            transform: rotate(30deg) scale(0);
            animation: growLeafRight 0.8s ease-out 0.9s forwards;
        }

        .bloom {
            position: absolute;
            top: 25px;
            width: 160px;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .petal-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .petal {
            position: absolute;
            width: 42px;
            height: 80px;
            background: radial-gradient(circle at 50% 15%, #f3e5f5, #ab47bc 65%, #4a148c);
            border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
            transform-origin: bottom center;
            bottom: 50%;
            opacity: 0;
            box-shadow: inset 0 0 12px rgba(255,255,255,0.5), 0 0 8px rgba(171, 71, 188, 0.4);
            transform: rotate(var(--deg)) scale(0);
        }

        .outer .petal {
            animation: bloomOuter 0.8s ease-out var(--delay) forwards;
        }

        .inner .petal {
            width: 35px;
            height: 65px;
            background: radial-gradient(circle at 50% 15%, #ffffff, #e040fb 60%, #7b1fa2);
            animation: bloomInner 0.7s ease-out var(--delay) forwards;
        }

        .center-core {
            position: absolute;
            width: 44px;
            height: 44px;
            background: radial-gradient(circle, #fff 20%, #ffb703 70%, #ff8f00 100%);
            border-radius: 50%;
            z-index: 10;
            transform: scale(0);
            box-shadow: 0 0 20px rgba(255, 183, 3, 0.9), inset 0 0 8px rgba(255,255,255,0.8);
            animation: popCenter 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 2.6s forwards;
        }

        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffeb3b;
            opacity: 0;
            animation: sparkleAnim 1.5s ease-in-out infinite;
        }
        .s1 { top: 20px; left: 40px; animation-delay: 2.7s; }
        .s2 { top: 40px; right: 30px; animation-delay: 3s; }
        .s3 { bottom: 60px; left: 50px; animation-delay: 2.9s; }

        .gift-note {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #f3e5f5;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
            opacity: 0;
            animation: fadeIn 1s ease 2.8s forwards;
        }

        @keyframes growStem { to { height: 165px; } }
        @keyframes growLeafLeft { to { opacity: 1; transform: rotate(-30deg) scale(1); } }
        @keyframes growLeafRight { to { opacity: 1; transform: rotate(30deg) scale(1); } }
        
        @keyframes bloomOuter { 
            0% { opacity: 0; transform: rotate(var(--deg)) scale(0); }
            100% { opacity: 0.95; transform: rotate(var(--deg)) scale(1); } 
        }
        @keyframes bloomInner { 
            0% { opacity: 0; transform: rotate(var(--deg)) scale(0); }
            100% { opacity: 1; transform: rotate(var(--deg)) scale(0.85); } 
        }
        @keyframes popCenter { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        
        @keyframes sparkleAnim {
            0%, 100% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Mesaj Ekranı -->
        <div id="card-content">
            <div class="heart" onclick="nextStep()">💜</div>
            <h1 id="title">İyi ki Varsın</h1>
            <p id="message">Üstüne tıklayarak sürprizi görebilirsin...</p>
            <button class="btn" id="action-btn" onclick="nextStep()">Tıkla ve Gör</button>
        </div>

        <!-- Gelişmiş Çiçek Animasyonu Ekranı -->
        <div class="flower-scene" id="flower-scene">
            <div class="flower-wrapper">
                <div class="stem"></div>
                <div class="leaf left"></div>
                <div class="leaf right"></div>
                
                <div class="bloom">
                    <!-- Dış Yapraklar -->
                    <div class="petal-layer outer">
                        <div class="petal" style="--deg: 0deg; --delay: 1.0s;"></div>
                        <div class="petal" style="--deg: 45deg; --delay: 1.1s;"></div>
                        <div class="petal" style="--deg: 90deg; --delay: 1.2s;"></div>
                        <div class="petal" style="--deg: 135deg; --delay: 1.3s;"></div>
                        <div class="petal" style="--deg: 180deg; --delay: 1.4s;"></div>
                        <div class="petal" style="--deg: 225deg; --delay: 1.5s;"></div>
                        <div class="petal" style="--deg: 270deg; --delay: 1.6s;"></div>
                        <div class="petal" style="--deg: 315deg; --delay: 1.7s;"></div>
                    </div>
                    <!-- İç Yapraklar -->
                    <div class="petal-layer inner">
                        <div class="petal" style="--deg: 22.5deg; --delay: 1.8s;"></div>
                        <div class="petal" style="--deg: 67.5deg; --delay: 1.9s;"></div>
                        <div class="petal" style="--deg: 112.5deg; --delay: 2.0s;"></div>
                        <div class="petal" style="--deg: 157.5deg; --delay: 2.1s;"></div>
                        <div class="petal" style="--deg: 202.5deg; --delay: 2.2s;"></div>
                        <div class="petal" style="--deg: 247.5deg; --delay: 2.3s;"></div>
                        <div class="petal" style="--deg: 292.5deg; --delay: 2.4s;"></div>
                        <div class="petal" style="--deg: 337.5deg; --delay: 2.5s;"></div>
                    </div>
                    <div class="center-core"></div>
                </div>

                <div class="sparkle s1"></div>
                <div class="sparkle s2"></div>
                <div class="sparkle s3"></div>
            </div>
            <div class="gift-note">Bu çiçek senin için güzelim 🌸💜</div>
        </div>
    </div>

    <script>
        const messages = [
            { title: "Seninle Her An...", text: "Dünyanın en güzel ve en değerli insanısın. İyi ki hayatımdasın! 🥰" },
            { title: "Birlikte Çok Güzeliz", text: "Gülüşün her şeye bedel. Seni çok ama çok seviyorum! ✨" },
            { title: "Sonsuza Kadar...", text: "Seninle geçirdiğim her saniye paha biçilemez. 💜" }
        ];

        let index = -1;
        let isLastStep = false;

        function nextStep() {
            if (isLastStep) {
                document.getElementById("card-content").style.display = "none";
                document.getElementById("flower-scene").style.display = "flex";
                return;
            }

            index++;
            document.getElementById("title").innerText = messages[index].title;
            document.getElementById("message").innerText = messages[index].text;

            if (index === messages.length - 1) {
                isLastStep = true;
                const btn = document.getElementById("action-btn");
                btn.innerText = "Hediyeni Al 🎁";
                btn.classList.add("btn-gift");
            }
        }
    </script>

</body>
</html>
