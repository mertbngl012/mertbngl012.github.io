<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Özel ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.15);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 90%;
            animation: fadeIn 1.5s ease-in-out;
        }

        /* Kalp Figürü Animasyonu */
        .heart {
            font-size: 80px;
            animation: heartbeat 1.2s infinite;
            cursor: pointer;
            margin-bottom: 20px;
            user-select: none;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.25); }
            60% { transform: scale(1); }
        }

        h1 {
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
            opacity: 0.9;
        }

        .btn {
            background-color: #fff;
            color: #ff4b6e;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn:hover {
            background-color: #ff4b6e;
            color: #fff;
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Kalp Figürü -->
        <div class="heart" onclick="changeText()">❤️</div>
        
        <h1 id="title">İyi ki Varsın</h1>
        <p id="message">Üstüne tıklayarak sürprizi görebilirsin...</p>
        
        <button class="btn" onclick="changeText()">Tıkla ve Gör</button>
    </div>

    <script>
        const messages = [
            { title: "Seninle Her An...", text: "Dünyanın en güzel ve en değerli insanısın. İyi ki hayatımdasın! 🥰" },
            { title: "Birlikte Çok Güzeliz", text: "Gülüşün her şeye bedel. Seni çok ama çok seviyorum! ✨" },
            { title: "Kodlar Bahane...", text: "Asıl asıl yazılımcı aşkı kalpte başlar. 💻❤️" },
            { title: "Sonsuza Kadar...", text: "Seninle geçirdiğim her saniye paha biçilemez. 🚀" }
        ];

        let index = 0;

        function changeText() {
            index = (index + 1) % messages.length;
            document.getElementById("title").innerText = messages[index].title;
            document.getElementById("message").innerText = messages[index].text;
        }
    </script>

</body>
</html>
